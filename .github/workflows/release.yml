name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            bun build --compile --target=bun-linux-arm64 --external react-devtools-core --outfile=arig-${{ matrix.target }} src/index.tsx
          else
            bun build --compile --external react-devtools-core --outfile=arig-${{ matrix.target }} src/index.tsx
          fi

      - name: Generate checksum
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 arig-${{ matrix.target }} > arig-${{ matrix.target }}.sha256
          else
            sha256sum arig-${{ matrix.target }} > arig-${{ matrix.target }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arig-${{ matrix.target }}
          path: |
            arig-${{ matrix.target }}
            arig-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/arig-darwin-arm64/*
            artifacts/arig-darwin-x64/*
            artifacts/arig-linux-x64/*
            artifacts/arig-linux-arm64/*
          generate_release_notes: true
